<div class="container">
<table>
    <tbody>
        <tr *ngFor="let mail of mails">
            <td class="id" [ngStyle]="{'color': mail.completed? 'grey' : 'black'}">{{mail.id}}</td>
            <td class="title" [ngStyle]="{'color': mail.completed? 'grey' : 'black'}">{{mail.title}}</td>
        </tr>
    </tbody>
</table>
</div>
