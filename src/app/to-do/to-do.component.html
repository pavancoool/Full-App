<div class="container-fluid">
<div class="container">
    <h1>📝 To-Do List</h1>
    
    <!-- Input for adding new tasks -->
    <input type="text" [(ngModel)]="newTask" placeholder="Add a new task..." (keyup.enter)="addTask()" />
    <button (click)="addTask()" class="add">➕ Add Task</button>
    
    <!-- Task List -->
    <div class="container ">
    <table class="table  table-striped mb-0">
        <tr>
            <th>To-Do ID</th>
            <th>To-Do Name</th>
            <th>Action</th>
        </tr>
      <tr *ngFor="let task of tasks; let i=index">

        <span [ngClass]="{ 'done': task.completed }" (click)="toggleTask(task)">
            <td>{{i+1}}</td>
          </span>
       
        <td>
        <span [ngClass]="{ 'done': task.completed }" (click)="toggleTask(task)">
          {{ task.name }}
        </span>
        </td>
        <td>
            <button class="delete-btn" (click)="deleteTask(task)">🗑️</button>
        </td>
        <!-- its just a dummy code -->
    </tr>
    </table>
    </div>
  </div>
  </div>
